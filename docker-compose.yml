version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./shieldvpn.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - WG_SERVER_ENDPOINT=${WG_SERVER_ENDPOINT:-}
    volumes:
      - server_data:/app/data
      - /etc/wireguard:/etc/wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_data:
